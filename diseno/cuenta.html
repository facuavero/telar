<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu cuenta · Telar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="telar.css?v=2">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231B1915'/%3E%3Cg fill='none' stroke-width='2.4' stroke-linecap='butt'%3E%3Cpath d='M5 8h14' stroke='%233447C4'/%3E%3Cpath d='M5 12h14' stroke='%23C4402A'/%3E%3Cpath d='M5 16h14' stroke='%23C98F12'/%3E%3Cpath d='M9 5v5.6M9 13.4v5.6' stroke='%23F5F2EB'/%3E%3Cpath d='M15 5v1.6M15 9.4v5.2M15 17.4v1.6' stroke='%23F5F2EB'/%3E%3C/g%3E%3C/svg%3E">
<style>
  .topbar{border-bottom:1px solid var(--line);background:var(--surface)}
  .topbar .wrap{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  main{max-width:720px;margin:0 auto;padding:64px 24px}
  .welcome{font:400 clamp(30px,4vw,42px)/1.1 var(--font-serif);letter-spacing:-.015em;margin:0 0 6px}
  .welcome em{color:var(--muted)}
  .who{color:var(--muted);font-size:14.5px;margin:0 0 40px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:32px;box-shadow:var(--shadow-1)}
  .card .i{color:var(--carmin);width:26px;height:26px}
  .card h2{font-size:17px;margin:14px 0 6px}
  .card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55;max-width:46ch}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="loading" id="loading">Cargando…</div>

<div id="app" style="display:none">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-mark" viewBox="0 0 24 24">
  <rect width="24" height="24" rx="6" fill="#1B1915" stroke="none"/>
  <g fill="none" stroke-width="2.4" stroke-linecap="butt">
    <path d="M5 8h14" stroke="#3447C4"/><path d="M5 12h14" stroke="#C4402A"/><path d="M5 16h14" stroke="#C98F12"/>
    <path d="M9 5v5.6M9 13.4V19" stroke="#F5F2EB"/>
    <path d="M15 5v1.6M15 9.4v5.2M15 17.4V19" stroke="#F5F2EB"/>
  </g>
</symbol>
<symbol id="p-spark" viewBox="0 0 256 256"><g fill="currentColor"><path d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88Z"/></g></symbol>
</svg>

<nav class="topbar">
  <div class="wrap">
    <a class="logo" href="landing.html"><svg><use href="#i-mark"/></svg>Telar</a>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="btn btn-ink" href="app/">Abrir la app</a>
      <button class="btn btn-ghost" id="btn-logout">Cerrar sesión</button>
    </div>
  </div>
</nav>

<main>
  <h1 class="welcome">Hola. <em>Bienvenido a Telar.</em></h1>
  <p class="who" id="who"></p>
  <div class="card">
    <svg class="i"><use href="#p-spark"/></svg>
    <h2>Tu cuenta está lista</h2>
    <p>Entrá a la app para armar tu primera automatización y conectar tus herramientas. El motor que las ejecuta todavía está en construcción: por ahora podés diseñarlas y correr pruebas.</p>
    <p style="margin-top:16px"><a class="btn btn-ink" href="app/">Abrir la app</a></p>
  </div>
</main>
</div>

<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  (async () => {
    if (telar.sinConfigurar) {
      document.getElementById('loading').textContent = 'Falta configurar supabase-config.js.';
      return;
    }
    const session = await telar.requireSession('login.html');
    if (!session) return;
    document.getElementById('who').textContent = session.user.email;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  })();

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await telar.signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
