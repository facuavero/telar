<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Telar</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#F5F2EB;color:#1B1915;
    font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .caja{max-width:38ch;padding:24px}
  b{display:block;font-size:19px;margin-bottom:8px}
  p{color:#736D63;margin:0 0 18px}
  code{font:12px ui-monospace,monospace;color:#B63A2A;word-break:break-all}
  button{height:36px;padding:0 16px;border-radius:9px;border:0;background:#1B1915;color:#F5F2EB;cursor:pointer;font-size:14px}
  @media (prefers-color-scheme:dark){body{background:#1B1915;color:#F5F2EB}p{color:#A39D92}}
</style></head>
<body>
  <div class="caja">
    <b>No se pudo abrir Telar</b>
    <p>Revisá la conexión. Si estás en desarrollo, que el server local esté corriendo.</p>
    <p><code id="detalle"></code></p>
    <button onclick="location.href=new URLSearchParams(location.search).get('url')">Reintentar</button>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById('detalle').textContent = (p.get('error') || '') + ' · ' + (p.get('url') || '');
  </script>
</body></html>
